name: build

# Builds, scans and signs the Terraria TShock image on Haruspex's ephemeral
# Kata runners. Trivy was replaced with Grype after the 2026 trivy-action
# supply-chain compromise; both scanners and cosign are pinned by version and
# checked against the release checksums before use.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install pinned scanners
        run: |
          set -euo pipefail
          GRYPE_VERSION=v0.122.1
          GRYPE_BARE="${GRYPE_VERSION#v}"
          curl -fsSL -o /tmp/grype.tgz \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_BARE}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/grype.sha256 \
            "https://github.com/anchore/grype/releases/download/${GRYPE_VERSION}/grype_${GRYPE_BARE}_checksums.txt"
          (cd /tmp && grep "grype_${GRYPE_BARE}_linux_amd64.tar.gz$" grype.sha256 | sha256sum -c -)
          tar -xzf /tmp/grype.tgz -C /usr/local/bin grype

          COSIGN_VERSION=v3.1.4
          curl -fsSL -o /usr/local/bin/cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          curl -fsSL -o /tmp/cosign.sha256 \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign_checksums.txt"
          (cd /usr/local/bin && grep "cosign-linux-amd64$" /tmp/cosign.sha256 | sha256sum -c -)
          chmod +x /usr/local/bin/cosign
          grype version | head -1
          cosign version | grep GitVersion

      - name: registry login
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | \
            docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

      - name: build and push
        run: |
          set -euo pipefail
          docker buildx create --name sidecar --driver remote tcp://127.0.0.1:1234 || true
          TAG="6.1.0-$(date -u +%Y%m%d%H%M)"
          docker buildx build --builder sidecar --platform linux/amd64 \
            -t "ghcr.io/kubedoll-heavy-industries/terraria-tshock:${TAG}" \
            -t "ghcr.io/kubedoll-heavy-industries/terraria-tshock:6.1.0" \
            --push --metadata-file /tmp/meta.json .
          DIGEST=$(python3 -c "import json;print(json.load(open('/tmp/meta.json'))['containerimage.digest'])")
          echo "DIGEST=${DIGEST}" >> "$GITHUB_ENV"
          echo "built ${DIGEST}"

      - name: scan
        run: |
          set -euo pipefail
          IMG="ghcr.io/kubedoll-heavy-industries/terraria-tshock@${DIGEST}"
          grype "$IMG" --fail-on critical --output table

      - name: sign
        run: |
          set -euo pipefail
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > /tmp/cosign.key
          COSIGN_PASSWORD="${{ secrets.COSIGN_PASSWORD }}" \
            cosign sign --yes --key /tmp/cosign.key \
            "ghcr.io/kubedoll-heavy-industries/terraria-tshock@${DIGEST}"
          rm -f /tmp/cosign.key
